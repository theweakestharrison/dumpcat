<template data-i18n="m-label">Backup-Methoden</template>
<template data-i18n="m-title">Das passende Werkzeug für jede Datenbank und jede Größe</template>
<template data-i18n="m-intro">Für MySQL und MariaDB steuert DumpCat <code>mysqldump</code>, <code>mydumper</code> und XtraBackup / MariaBackup. Wenn Sie einen Server hinzufügen, zeigt <em>Test connection</em> die Version, das Datadir, die Größe jeder Datenbank und welche Methoden auf diesem Rechner funktionieren.</template>
<template data-i18n="m-table">
  <thead>
    <tr><th scope="col"></th><th scope="col">mysqldump<small>logisch</small></th><th scope="col">mydumper<small>logisch, parallel</small></th><th scope="col">XtraBackup / MariaBackup<small>physisch, im laufenden Betrieb</small></th></tr>
  </thead>
  <tbody>
    <tr><th scope="row">Sperrt die Datenbank?</th><td data-m="mysqldump">Bei InnoDB nicht, dank <code>--single-transaction</code></td><td data-m="mydumper">Eine globale Sperre für wenige Millisekunden, um die Threads abzugleichen, danach keine</td><td data-m="physisch">Keine InnoDB-Sperren; ganz am Ende eine sehr kurze Backup-Sperre</td></tr>
    <tr><th scope="row">Tempo beim Backup</th><td data-m="mysqldump">1 Thread pro Datenbank, mehrere Datenbanken parallel</td><td data-m="mydumper">Mehrere Threads, Tabellen in Zeilenblöcke aufgeteilt</td><td data-m="physisch">Am schnellsten: Dateikopie mit mehreren Threads</td></tr>
    <tr><th scope="row">Tempo beim Wiederherstellen</th><td data-m="mysqldump">Am langsamsten</td><td data-m="mydumper">Schnell: parallel, Indizes werden nach dem Laden erstellt</td><td data-m="physisch">Sehr schnell: Dateikopie + Prepare</td></tr>
    <tr><th scope="row">Inkrementell</th><td class="no" data-m="mysqldump">Nein</td><td class="no" data-m="mydumper">Nein</td><td class="yes" data-m="physisch">Ja</td></tr>
    <tr><th scope="row">Einzelne Datenbank wiederherstellen, umbenennen</th><td class="yes" data-m="mysqldump">Ja</td><td class="yes" data-m="mydumper">Ja</td><td class="no" data-m="physisch">Nein, nur die ganze Instanz</td></tr>
    <tr class="fit"><th scope="row">Ideal für</th><td data-m="mysqldump">Datenbanken unter 20–50 GB</td><td data-m="mydumper">Große Datenbanken, einzeln wiederhergestellt</td><td data-m="physisch">100 GB bis mehrere TB, niedrige RTO</td></tr>
  </tbody>
</template>
<template data-i18n="m-pg"><b>PostgreSQL</b> ab Version 10: <code>pg_dump</code> pro Datenbank, wobei Tabellen parallel gesichert und wiederhergestellt werden, auch unter neuem Namen oder auf einem anderen Server; <code>pg_basebackup</code> für den ganzen Cluster über eine Replikationsverbindung, mit kontinuierlicher WAL-Archivierung zur Wiederherstellung auf einen Zeitpunkt, einen Wiederherstellungspunkt oder eine WAL-Position.</template>
<template data-i18n="s-label">Speicher</template>
<template data-i18n="s-title">Ein Job, Kopien an mehreren Orten</template>
<template data-i18n="s-intro">Auf die lokale Festplatte schreiben und danach hochladen, oder ohne temporären Speicherplatz direkt in die Cloud streamen. Jeder Speicher behält seine eigene Anzahl an Kopien, zum Beispiel 3 Backups lokal und 30 Tage auf S3.</template>
<template data-i18n="s-targets">
  <li><b>Lokal / NFS</b><span>Am schnellsten wiederhergestellt; nicht auf der Datadir-Platte ablegen</span></li>
  <li><b>S3</b><span>AWS, Cloudflare R2, MinIO, Wasabi, DigitalOcean</span></li>
  <li><b>Google Drive</b><span>OAuth oder ein Dienstkonto</span></li>
  <li><b>OneDrive</b><span>Inklusive SharePoint</span></li>
  <li><b>FTP / FTPS</b><span>Explizites oder implizites TLS</span></li>
  <li><b>SFTP</b><span>Passwort oder privater Schlüssel</span></li>
  <li><b>WebDAV</b><span>Nextcloud und Co.</span></li>
  <li><b>Backblaze B2</b><span>Dazu Azure Blob und Dropbox</span></li>
  <li><b>rclone</b><span>Über 70 weitere Backends</span></li>
</template>
<template data-i18n="s-aside-title">Standardformate, kein Lock-in</template>
<template data-i18n="s-aside-text">Der Rechner mit DumpCat ist weg? Installieren Sie DumpCat neu, fügen Sie den Speicher wieder hinzu und klicken Sie auf <em>Import backup catalog</em>: Alle Backups erscheinen wieder in der Liste. Auch ohne DumpCat können Sie mit <code>age</code>, <code>zstd</code> und <code>mysql</code> oder <code>pg_restore</code> wiederherstellen.</template>
<template data-i18n="c-label">Verbindung</template>
<template data-i18n="c-title">Datenbank ohne offenen Port? Wird trotzdem gesichert.</template>
<template data-i18n="c-intro">Wenn der Backup-Server die Datenbank nicht direkt erreicht, etwa wegen einer Firewall, NAT oder weil die Datenbank nur auf 127.0.0.1 lauscht, baut stattdessen der Datenbank-Host die Verbindung zu DumpCat auf. Dafür gibt es zwei Wege, und keiner öffnet einen Port auf dem Datenbank-Host. Backups, Wiederherstellungen und Point-in-Time-Recovery funktionieren wie bei einer direkten Verbindung.</template>

<template data-i18n="o-label">Betrieb</template>
<template data-i18n="o-title">Was Sie sonst selbst skripten müssten</template>
<template data-i18n="o-intro">All das ist in DumpCat enthalten und wird in der Weboberfläche eingeschaltet und eingestellt.</template>
<template data-i18n="o-list">
  <div><dt>Vor dem Upload verschlüsselt</dt><dd>age (ChaCha20-Poly1305 + scrypt) läuft auf Ihrem Server, daher kann der Cloud-Anbieter Ihre Daten nicht lesen.</dd></div>
  <div><dt>Integritätsprüfungen</dt><dd><span class="nw">SHA-256</span> für jede Datei. Die Verifizierung liest erneut, entschlüsselt, entpackt und sucht nach der Zeile <code>Dump completed</code>.</dd></div>
  <div><dt>GFS-Aufbewahrung</dt><dd>N Backups, N Tage, jeweils das letzte jedes Tages, jeder Woche und jedes Monats. Inkrementelle Ketten werden nur zusammen mit ihrem Vollbackup gelöscht.</dd></div>
  <div><dt>Umsichtige Wiederherstellung</dt><dd>Jede Datei wird probeweise entschlüsselt, bevor irgendeine Datenbank gelöscht wird. Wiederherstellung unter neuen Namen oder auf einen anderen Server und eine andere Version (MySQL 8 ↔ MariaDB, PostgreSQL 15 → 16).</dd></div>
  <div><dt>Konten und Rollen</dt><dd>admin, operator, viewer. TOTP-Zwei-Faktor-Authentifizierung, API-Tokens, ein Audit-Log und Sperre nach wiederholt fehlgeschlagenen Anmeldungen.</dd></div>
  <div><dt>Benachrichtigungen</dt><dd>E-Mail, Telegram, Slack, Discord und HMAC-signierte Webhooks, bei Fehlern oder bei Erfolg.</dd></div>
  <div><dt>Datenbanken hinter einer Firewall</dt><dd>Ein Agent auf dem Datenbank-Host verbindet sich ausgehend per HTTPS mit DumpCat, oder der Host tritt dem integrierten WireGuard bei. Zur Datenbank muss kein Port geöffnet werden.</dd></div>
  <div><dt>Selbst-Update</dt><dd><code>dumpcat update</code> prüft <span class="nw">SHA-256</span>, sichert die Konfiguration, wartet laufende Backups ab und rollt bei einem Fehler zurück.</dd></div>
</template>
<template data-i18n="oss-label">Open Source</template>
<template data-i18n="oss-title">Kostenlos, Open Source, und Ihre Daten gehören Ihnen</template>
<template data-i18n="oss-intro">DumpCat steht unter der Apache-2.0-Lizenz. Kein Konto, kein Lizenzschlüssel, keine kostenpflichtige Edition, die Funktionen zurückhält: Alles auf dieser Seite steckt in dem Build, den Sie herunterladen.</template>
<template data-i18n="oss-list">
  <div><dt>Apache-2.0-Lizenz</dt><dd>Nutzen Sie es privat oder im Unternehmen, ändern Sie es und geben Sie es weiter. Der vollständige Text steht in <a href="https://github.com/theweakestharrison/DumpCat/blob/main/LICENSE">LICENSE</a>.</dd></div>
  <div><dt>Keine Telemetrie</dt><dd>DumpCat sendet keinerlei Nutzungsdaten. Die einzige Verbindung, die es von sich aus aufbaut, ist der tägliche Abruf von <code>latest.json</code>, um neue Versionen anzukündigen, und den können Sie in den Einstellungen abschalten.</dd></div>
  <div><dt>Kein Umweg über Dritte</dt><dd>Backups, Datenbankpasswörter und Verschlüsselungsschlüssel gelangen nur von Ihrem Server zu dem Speicher, den Sie wählen.</dd></div>
  <div><dt>Signierte Releases</dt><dd>Jedes Update ist mit ed25519 signiert und wird vor der Installation gegen <span class="nw">SHA-256</span> geprüft. Zum Selbstbauen brauchen Sie nur Go.</dd></div>
</template>

<template data-i18n="ai-title">Ein KI-Assistent behält die Backups im Blick, ohne dass Sie ihm die Schlüssel geben</template>
<template data-i18n="ai-intro">DumpCat ist ein MCP-Server. Verbinden Sie Claude Code, Claude Desktop oder einen anderen MCP-Client mit einem API-Token und fragen Sie in normalen Worten: Der Assistent sieht nach, was fehlgeschlagen oder überfällig ist, liest das Log und erklärt die Ursache. Andere KI-Agenten lesen die API-Referenz in Markdown, die Ihr eigener Server für sie schreibt.</template>
<template data-i18n="ai-q1">Welche Backups sind letzte Nacht fehlgeschlagen, und warum?</template>
<template data-i18n="ai-tools-aria">Aufgerufene MCP-Tools</template>
<template data-i18n="ai-a1">Einer von 12 Jobs: <b>shop-nightly</b> brach um 02:14 mit <code>errno 28</code> ab, also ist <code>/var/backups</code> auf db-01 voll. Die anderen 11 liefen erfolgreich. Schaffen Sie etwas Platz oder behalten Sie in der Weboberfläche weniger lokale Kopien, dann starte ich ihn erneut.</template>
<template data-i18n="ai-q2">Erledigt, starte ihn noch einmal.</template>
<template data-i18n="ai-ask"><code>run_backup</code> (shop-nightly, voll) erlauben?</template>
<template data-i18n="ai-allow">Erlauben</template>
<template data-i18n="ai-deny">Ablehnen</template>
<template data-i18n="ai-a2">Backup 4813 läuft, 41 % erledigt. Ich prüfe das Ergebnis, sobald es fertig ist.</template>
<template data-i18n="ai-chat-note">Ein Beispiel mit einem Token mit Vollzugriff. Mit einem Nur-Lese-Token, der Voreinstellung, kann der Assistent nur nachsehen und nichts starten.</template>
<template data-i18n="ai-perm-title">Was ein Assistent darf</template>
<template data-i18n="ai-perm-look"><b>Nachsehen</b><small>Nur-Lese-Token, die Voreinstellung</small><span>Übersicht und Warnungen, Jobs, Backups, Fehler und Logs, Binlog- / WAL-Archivierung, Ergebnisse von Wiederherstellungen und Wiederherstellungstests, Vorschauen der Point-in-Time-Recovery.</span></template>
<template data-i18n="ai-perm-run"><b>Starten</b><small>Token mit Vollzugriff, operator oder admin</small><span>Ein Backup ausführen, ein Backup verifizieren, einen Wiederherstellungstest starten. Der KI-Client fragt Sie jedes Mal vorher.</span></template>
<template data-i18n="ai-perm-never"><b>Niemals über MCP</b><small>Mit keinem Token</small><span>Wiederherstellungen, Löschungen, Zugangsdaten und Einstellungen. Keine Option schaltet sie frei: Das bleibt der Weboberfläche vorbehalten.</span></template>
<template data-i18n="ai-perm-note">Antworten enthalten nie Passwörter, Schlüssel oder Tokens, und Zugangsdaten in Fehlermeldungen und Logs werden maskiert. Jeder Aufruf läuft mit Ihrem Token über die REST-API, wird also wie jede andere Anfrage geprüft und im Audit-Log festgehalten.</template>

<template data-i18n="ai-tab-agent">Andere Agenten</template>
<template data-i18n="ai-cc-note">Setzen Sie Ihre eigene Adresse und Ihren Token ein, oder kopieren Sie den ausgefüllten Befehl von der Seite <em>API &amp; MCP</em>. Um den Server ohne Token in einem Projekt zu teilen, bietet die Seite auch eine <code>.mcp.json</code>, die den Token aus der Umgebung liest.</template>
<template data-i18n="ai-cd-note">Öffnen Sie <em>Settings → Developer → Edit Config</em>, fügen Sie ein und starten Sie Claude Desktop neu. <code>dumpcat mcp</code> ist eine kleine stdio-Brücke, die auf dem Rechner mit Claude Desktop läuft; unter Linux ist <code>command</code> der Pfad zum <code>dumpcat</code>-Programm, unter macOS bauen Sie es selbst mit Go.</template>
<template data-i18n="ai-mcp-note">Der Endpunkt <code>/api/mcp</code> (streamable HTTP) ist Teil von DumpCat, es muss nichts weiter installiert werden. Clients, die nur einen lokalen Befehl starten, nutzen <code>dumpcat mcp</code> mit <code>DUMPCAT_MCP_URL</code> und <code>DUMPCAT_MCP_TOKEN</code> in der Umgebung.</template>
<template data-i18n="ai-md-note"><code>/api/docs.md</code> ist die vollständige API-Referenz in Markdown, vom Server selbst geschrieben und daher immer passend zur laufenden Version: Authentifizierung, Konventionen, curl-Beispiele und jede Route mit dem nötigen Zugriff. Lassen Sie einen Agenten sie lesen und die REST-API aufrufen, oder fügen Sie sie in einen Chat ein (<em>API &amp; MCP → Copy Markdown</em>). <code>/api/mcp/tools</code> listet die MCP-Tools als JSON.</template>

<template data-i18n="i-label">Installation</template>
<template data-i18n="i-title">In einer Minute startklar</template>
<template data-i18n="i-intro">Unter Linux ein einziger Befehl, unter Windows herunterladen und doppelklicken. Der Installer richtet einen Dienst ein, der mit dem Rechner startet, dazu die Backup-Tools passend zu Ihrer Datenbankversion; die Weboberfläche steckt mit in einer einzigen Datei.</template>
<template data-i18n="os-aria">Betriebssystem</template>
<template data-i18n="copy">Kopieren</template>
<template data-i18n="i-linux-lead">Fügen Sie auf dem Linux-Server diesen Befehl ein und drücken Sie Enter:</template>
<template data-i18n="i-linux-note">Er lädt das neueste Release herunter, prüft die Prüfsumme und installiert es als systemd-Dienst nach <code>/opt/dumpcat</code>, zusammen mit <code>rclone</code>, dem MySQL/MariaDB-Client, dem passenden mariabackup oder XtraBackup und mydumper, sofern die Paketquellen es anbieten; <code>--postgres 16</code> fügt die Client-Tools von PostgreSQL 16 hinzu. Optionen kommen hinter <code>sh -s --</code>: <code>--port 9090</code>, <code>--listen 127.0.0.1</code>, <code>--tls-auto</code>.</template>
<template data-i18n="i-win-1"><b>Die .zip-Datei herunterladen</b></template>
<template data-i18n="i-win-dl">Für Windows herunterladen</template>
<template data-i18n="i-win-2"><b>Entpacken</b>: Rechtsklick auf die Datei, <i>Extract All</i> („Alle extrahieren“) wählen.</template>
<template data-i18n="i-win-3"><b>Doppelklick auf <i>Install DumpCat</i></b>, dann mit <i>Yes</i> („Ja“) bestätigen. Ihr Browser öffnet DumpCat; das Installationsfenster zeigt das Setup-Token.</template>
<template data-i18n="i-win-note">Windows 10 / 11 oder Windows Server 2016+ 64-Bit, läuft als Windows-Dienst. Lieber PowerShell? Führen Sie <code>irm https://dumpcat.cc/install.ps1 | iex</code> in PowerShell (als Administrator) aus. mydumper und XtraBackup für MySQL sind nicht verfügbar; für Datenbanken mit Hunderten von GB betreiben Sie DumpCat unter Linux.</template>
<template data-i18n="i-guide">Neu auf der Kommandozeile? <a href="/install/">Folgen Sie der Schritt-für-Schritt-Anleitung</a> (auf Englisch), mit Lösungen für häufige Probleme.</template>
<template data-i18n="i-steps-title">Nach der Installation</template>
<template data-i18n="i-steps">
  <li><div><b><code>http://&lt;server-ip&gt;:6369</code> öffnen</b><span>Legen Sie das Admin-Konto mit dem einmaligen Setup-Token an, das der Installer ausgibt (erneut anzeigen: <code>dumpcat setup-token</code>).</span></div></li>
  <li><div><b>Datenbankserver hinzufügen</b><span>Test connection listet fehlende Rechte und die nutzbaren Methoden auf.</span></div></li>
  <li><div><b>Speicher hinzufügen</b><span>Test schreibt, liest und löscht eine Datei.</span></div></li>
  <li><div><b>Backup-Job anlegen</b><span>Zeitplan, Verschlüsselung, Speicher und Aufbewahrung wählen, dann auf Save &amp; run now klicken.</span></div></li>
</template>
<template data-i18n="meow-title">Port 6369 ergibt <em>MEOW</em></template>
<template data-i18n="meow">Tippen Sie 6-3-6-9 auf einer Telefontastatur, und Sie erhalten MEOW, englisch für „miau“. Das ist der Standardport der Weboberfläche.</template>
