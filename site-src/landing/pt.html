<template data-i18n="lead">O DumpCat é um único binário com interface web. Ele agenda backups, compacta e criptografa os arquivos, envia cópias para S3, Google Drive, OneDrive ou SFTP, verifica cada uma e traz seus dados de volta quando você precisar. Roda em Linux e Windows, totalmente offline.</template>

<template data-i18n="m-label">Métodos de backup</template>
<template data-i18n="m-title">A ferramenta certa para cada banco e cada tamanho</template>
<template data-i18n="m-intro">Para MySQL e MariaDB, o DumpCat orquestra <code>mysqldump</code>, <code>mydumper</code> e XtraBackup / MariaBackup. Ao adicionar um servidor, <em>Test connection</em> mostra a versão, o datadir, o tamanho de cada banco e quais métodos funcionam naquela máquina.</template>
<template data-i18n="m-table">
  <thead>
    <tr><th scope="col"></th><th scope="col">mysqldump<small>lógico</small></th><th scope="col">mydumper<small>lógico, paralelo</small></th><th scope="col">XtraBackup / MariaBackup<small>físico, a quente</small></th></tr>
  </thead>
  <tbody>
    <tr><th scope="row">Bloqueia o banco?</th><td data-m="mysqldump">Não no InnoDB, graças ao <code>--single-transaction</code></td><td data-m="mydumper">Um bloqueio global de poucos milissegundos para sincronizar as threads, depois nenhum</td><td data-m="físico">Nenhum bloqueio no InnoDB; um bloqueio de backup muito breve no final</td></tr>
    <tr><th scope="row">Velocidade do backup</th><td data-m="mysqldump">1 thread por banco, vários bancos em paralelo</td><td data-m="mydumper">Multithread, tabelas divididas em blocos de linhas</td><td data-m="físico">A mais rápida: cópia de arquivos multithread</td></tr>
    <tr><th scope="row">Velocidade da restauração</th><td data-m="mysqldump">A mais lenta</td><td data-m="mydumper">Rápida: em paralelo, índices criados após a carga</td><td data-m="físico">Muito rápida: cópia de arquivos + prepare</td></tr>
    <tr><th scope="row">Incremental</th><td class="no" data-m="mysqldump">Não</td><td class="no" data-m="mydumper">Não</td><td class="yes" data-m="físico">Sim</td></tr>
    <tr><th scope="row">Restaurar um só banco, renomear</th><td class="yes" data-m="mysqldump">Sim</td><td class="yes" data-m="mydumper">Sim</td><td class="no" data-m="físico">Não, só a instância inteira</td></tr>
    <tr class="fit"><th scope="row">Ideal para</th><td data-m="mysqldump">Bancos com menos de 20–50 GB</td><td data-m="mydumper">Bancos grandes restaurados um de cada vez</td><td data-m="físico">De 100 GB a vários TB, RTO baixo</td></tr>
  </tbody>
</template>
<template data-i18n="m-pg"><b>PostgreSQL</b> 10 ou mais recente: <code>pg_dump</code> por banco, com as tabelas exportadas e restauradas em paralelo, com outro nome ou em outro servidor; <code>pg_basebackup</code> para o cluster inteiro por uma conexão de replicação, com arquivamento contínuo de WAL para recuperar até um horário, um ponto de restauração ou uma posição do WAL.</template>
<template data-i18n="m-ms"><b>SQL Server</b> 2012 ou mais recente, no Windows, no Linux e em contêineres: backups nativos completos e diferenciais com <code>BACKUP DATABASE</code> (sem ferramentas cliente), restauração com outro nome ou em outro servidor, testes de restauração com <code>DBCC CHECKDB</code> e backups de log agendados para recuperar até um horário, uma transação marcada ou um LSN. O SQL Server grava os backups no próprio host: o DumpCat os lê de uma pasta compartilhada, ou um agente nesse host os transfere, sem compartilhar nada.</template>
<template data-i18n="s-label">Armazenamento</template>
<template data-i18n="s-title">Um job, cópias em vários lugares</template>
<template data-i18n="s-intro">Grave no disco local e depois envie, ou transmita direto para a nuvem sem disco temporário. Cada armazenamento guarda sua própria quantidade de cópias, por exemplo 3 backups no local e 30 dias no S3.</template>
<template data-i18n="s-targets">
  <li><b>Local / NFS</b><span>O mais rápido para restaurar; mantenha fora do disco do datadir</span></li>
  <li><b>S3</b><span>AWS, Cloudflare R2, MinIO, Wasabi, DigitalOcean</span></li>
  <li><b>Google Drive</b><span>OAuth ou uma conta de serviço</span></li>
  <li><b>OneDrive</b><span>SharePoint incluído</span></li>
  <li><b>FTP / FTPS</b><span>TLS explícito ou implícito</span></li>
  <li><b>SFTP</b><span>Senha ou chave privada</span></li>
  <li><b>WebDAV</b><span>Nextcloud e companhia</span></li>
  <li><b>Backblaze B2</b><span>Além de Azure Blob e Dropbox</span></li>
  <li><b>rclone</b><span>Mais de 70 outros backends</span></li>
</template>
<template data-i18n="s-aside-title">Formatos padrão, sem amarras</template>
<template data-i18n="s-aside-text">Perdeu a máquina que roda o DumpCat? Instale uma cópia nova, adicione o armazenamento de novo e clique em <em>Import backup catalog</em>: todos os backups voltam para a lista. Sem o DumpCat, você ainda consegue restaurar com <code>age</code>, <code>zstd</code> e <code>mysql</code>, <code>pg_restore</code> ou o <code>RESTORE DATABASE</code> do SQL Server.</template>
<template data-i18n="c-label">Conectividade</template>
<template data-i18n="c-title">Banco sem nenhuma porta aberta? Tem backup do mesmo jeito.</template>
<template data-i18n="c-intro">Quando o servidor de backup não consegue se conectar diretamente ao banco, por causa de um firewall, de NAT ou de um banco que só escuta em 127.0.0.1, deixe que o host do banco abra a conexão até o DumpCat. Há duas formas, e nenhuma abre porta no host do banco. Backups, restaurações e recuperação point-in-time funcionam como numa conexão direta.</template>

<template data-i18n="c-note">O host do banco abre a conexão; os dados trafegam nos dois sentidos dentro dela. Backups físicos (XtraBackup / MariaBackup) funcionam por um agente iniciado com <code>--allow-physical</code>; pelo WireGuard, eles ainda exigem o DumpCat instalado no host do banco. Os arquivos de backup do SQL Server também passam por um agente iniciado com <code>--allow-mssql-dir</code>, sem pasta compartilhada.</template>
<template data-i18n="o-label">Operações</template>
<template data-i18n="o-title">Tudo aquilo que você faria com scripts caseiros</template>
<template data-i18n="o-intro">Tudo isso já vem no DumpCat e é ativado e ajustado pela interface web.</template>
<template data-i18n="o-list">
  <div><dt>Criptografado e verificado</dt><dd>O age (ChaCha20-Poly1305 + scrypt) criptografa no seu servidor antes do upload. <span class="nw">SHA-256</span> para cada arquivo, e cada backup é relido, descriptografado e descompactado logo depois de gravado.</dd></div>
  <div><dt>Retenção GFS</dt><dd>Mantenha N backups, N dias, o último de cada dia, semana e mês. Cadeias incrementais só são apagadas junto com o seu backup completo.</dd></div>
  <div><dt>Restaurações cuidadosas</dt><dd>Cada arquivo passa por um teste de descriptografia antes de qualquer banco ser apagado. Restaure com novos nomes, ou em outro servidor e outra versão (MySQL 8 ↔ MariaDB, PostgreSQL 15 → 16).</dd></div>
  <div><dt>Equipes e login único</dt><dd>Quantos usuários você precisar, como admin, operator ou viewer. Login com Google, Microsoft Entra ID ou qualquer provedor OpenID Connect, dois fatores com TOTP, tokens de API e log de auditoria.</dd></div>
  <div><dt>Seu nome e seu logo</dt><dd>White-label: seu nome e seu logo substituem o DumpCat na interface web, na página de login, na aba do navegador e em cada notificação.</dd></div>
  <div><dt>Notificações</dt><dd>E-mail, Telegram, Slack, Discord e webhooks assinados com HMAC, em caso de falha ou de sucesso.</dd></div>
  <div><dt>Bancos atrás de firewall</dt><dd>Um agente no host do banco se conecta ao DumpCat por HTTPS, ou o host entra no WireGuard integrado. Nenhuma porta precisa ser aberta para o banco.</dd></div>
  <div><dt>Atualizações OTA</dt><dd>Ligue a instalação automática e as novas versões assinadas chegam do servidor de build do DumpCat no horário que você escolher. Ele espera os backups em andamento terminarem, faz backup do próprio banco de dados e reverte sozinho se algo falhar. Nada para recompilar.</dd></div>
</template>
<template data-i18n="oss-label">Código aberto</template>
<template data-i18n="oss-title">Grátis, de código aberto, e seus dados continuam seus</template>
<template data-i18n="oss-intro">O DumpCat é distribuído sob a licença Apache-2.0. Sem conta, sem chave de licença, sem edição paga segurando recursos: tudo o que está nesta página vem na versão que você baixa.</template>
<template data-i18n="oss-list">
  <div><dt>Licença Apache-2.0</dt><dd>Use em casa ou no trabalho, modifique e redistribua. O texto completo está em <a href="https://github.com/theweakestharrison/DumpCat/blob/main/LICENSE">LICENSE</a>.</dd></div>
  <div><dt>Sem telemetria</dt><dd>O DumpCat não envia dados de uso para lugar nenhum. As únicas chamadas que ele faz por conta própria leem o <code>latest.json</code> para avisar sobre novas versões e, se você ligar a instalação automática, baixam essas versões. Você pode desligar as duas nas configurações.</dd></div>
  <div><dt>Sem intermediários</dt><dd>Backups, senhas de banco e chaves de criptografia só trafegam do seu servidor para o armazenamento que você escolher.</dd></div>

</template>

<template data-i18n="ai-cd-note">Abra <em>Settings → Developer → Edit Config</em>, cole e reinicie o Claude Desktop. <code>dumpcat mcp</code> é uma pequena ponte stdio que roda no computador do Claude Desktop; no Linux, <code>command</code> é o caminho do binário <code>dumpcat</code>, e no macOS você compila com Go.</template>
<template data-i18n="ai-mcp-note">O endpoint <code>/api/mcp</code> (streamable HTTP) faz parte do DumpCat, não há mais nada para instalar. Clientes que só iniciam um comando local usam <code>dumpcat mcp</code>, com <code>DUMPCAT_MCP_URL</code> e <code>DUMPCAT_MCP_TOKEN</code> no ambiente.</template>
<template data-i18n="ai-md-note"><code>/api/docs.md</code> é a referência completa da API em Markdown, escrita pelo próprio servidor, então sempre bate com a versão que você roda: autenticação, convenções, exemplos com curl e cada rota com o acesso que exige. Deixe um agente ler e chamar a API REST, ou cole em um chat (<em>API &amp; MCP → Copy Markdown</em>). <code>/api/mcp/tools</code> lista as ferramentas MCP em JSON.</template>

<template data-i18n="i-label">Instalação</template>
<template data-i18n="i-title">Rodando em um minuto</template>
<template data-i18n="i-intro">Um comando no Linux; no Windows, baixe e dê um duplo clique. O instalador configura um serviço que inicia junto com a máquina e as ferramentas de backup compatíveis com a versão do seu banco; a interface web vem embutida num único arquivo.</template>
<template data-i18n="os-aria">Sistema operacional</template>
<template data-i18n="copy">Copiar</template>
<template data-i18n="i-linux-lead">No servidor Linux, cole este comando e pressione Enter:</template>
<template data-i18n="i-linux-note">Ele baixa a versão mais recente, confere o checksum e instala em <code>/opt/dumpcat</code> como serviço systemd, com <code>rclone</code>, o cliente MySQL/MariaDB, o mariabackup ou XtraBackup compatível e o mydumper quando os repositórios o tiverem; <code>--postgres 16</code> adiciona as ferramentas cliente do PostgreSQL 16. As opções vão depois de <code>sh -s --</code>: <code>--port 9090</code>, <code>--listen 127.0.0.1</code>, <code>--tls-auto</code>.</template>
<template data-i18n="i-win-1"><b>Baixe o .zip</b></template>
<template data-i18n="i-win-dl">Baixar para Windows</template>
<template data-i18n="i-win-2"><b>Descompacte</b>: clique com o botão direito no arquivo e escolha <i>Extract All</i>.</template>
<template data-i18n="i-win-3"><b>Dê um duplo clique em <i>Install DumpCat</i></b> e responda <i>Yes</i>. O navegador abre o DumpCat; a janela de instalação mostra o token de configuração.</template>
<template data-i18n="i-win-note">Windows 10 / 11 ou Windows Server 2016+ 64 bits, roda como serviço do Windows. Prefere PowerShell? Execute <code>irm https://dumpcat.cc/install.ps1 | iex</code> no PowerShell (Administrador). mydumper e XtraBackup para MySQL não estão disponíveis; use o DumpCat no Linux para bancos de centenas de GB.</template>
<template data-i18n="i-guide">Novo na linha de comando? <a href="/install/">Siga o guia passo a passo</a> (em inglês), com soluções para os problemas mais comuns.</template>
<template data-i18n="i-steps-title">Depois de instalar</template>
<template data-i18n="i-steps">
  <li><div><b>Abra <code>http://&lt;server-ip&gt;:6369</code></b><span>Crie a conta de administrador com o token de configuração de uso único que o instalador exibe (para vê-lo de novo: <code>dumpcat setup-token</code>).</span></div></li>
  <li><div><b>Adicione um servidor de banco de dados</b><span>O botão Test connection lista os privilégios que faltam e os métodos que você pode usar.</span></div></li>
  <li><div><b>Adicione um armazenamento</b><span>O botão Test grava, lê e apaga um arquivo.</span></div></li>
  <li><div><b>Crie um job de backup</b><span>Escolha agendamento, criptografia, armazenamento e retenção, depois clique em Save &amp; run now.</span></div></li>
</template>
<template data-i18n="meow-title">A porta 6369 faz <em>MEOW</em></template>
<template data-i18n="meow">Digite 6-3-6-9 no teclado de um celular e você tem MEOW, o “miau” em inglês. É a porta padrão da interface web.</template>
