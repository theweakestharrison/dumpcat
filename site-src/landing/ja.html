<template data-i18n="m-title">データベースと規模に合わせて、最適なツールを</template>
<template data-i18n="m-intro">MySQL と MariaDB では、DumpCat が <code>mysqldump</code>、<code>mydumper</code>、XtraBackup / MariaBackup を使い分けます。サーバーを追加するときに <em>Test connection</em> を押すと、バージョン、datadir、各データベースのサイズ、そのマシンで使える方式が表示されます。</template>
<template data-i18n="m-table">
  <thead>
    <tr><th scope="col"></th><th scope="col">mysqldump<small>論理</small></th><th scope="col">mydumper<small>論理・並列</small></th><th scope="col">XtraBackup / MariaBackup<small>物理・ホット</small></th></tr>
  </thead>
  <tbody>
    <tr><th scope="row">データベースのロック</th><td data-m="mysqldump"><code>--single-transaction</code> により InnoDB ではロックなし</td><td data-m="mydumper">スレッド同期のため数ミリ秒だけグローバルロック、その後はなし</td><td data-m="物理">InnoDB はロックなし。最後にごく短いバックアップロックのみ</td></tr>
    <tr><th scope="row">バックアップ速度</th><td data-m="mysqldump">データベースごとに 1 スレッド、複数のデータベースを並列処理</td><td data-m="mydumper">マルチスレッド、テーブルを行単位で分割</td><td data-m="物理">最速：マルチスレッドでファイルをコピー</td></tr>
    <tr><th scope="row">リストア速度</th><td data-m="mysqldump">最も遅い</td><td data-m="mydumper">速い：並列処理、インデックスはロード後に構築</td><td data-m="物理">非常に速い：ファイルコピー + prepare</td></tr>
    <tr><th scope="row">増分バックアップ</th><td class="no" data-m="mysqldump">非対応</td><td class="no" data-m="mydumper">非対応</td><td class="yes" data-m="物理">対応</td></tr>
    <tr><th scope="row">単一データベースのリストア（別名も可）</th><td class="yes" data-m="mysqldump">可能</td><td class="yes" data-m="mydumper">可能</td><td class="no" data-m="物理">不可（インスタンス全体のみ）</td></tr>
    <tr class="fit"><th scope="row">最適な用途</th><td data-m="mysqldump">20〜50 GB 未満のデータベース</td><td data-m="mydumper">1 つずつリストアする大規模データベース</td><td data-m="物理">100 GB〜数 TB、短い RTO</td></tr>
  </tbody>
</template>
<template data-i18n="m-pg"><b>PostgreSQL</b> 10 以降：データベースごとの <code>pg_dump</code>（テーブルを並列でダンプ・リストアでき、別名や別サーバーへのリストアも可能）と、レプリケーション接続でクラスタ全体を取得する <code>pg_basebackup</code>。継続的な WAL アーカイブにより、指定した時刻、リストアポイント、WAL 位置までリカバリできます。</template>
<template data-i18n="s-label">ストレージ</template>
<template data-i18n="s-title">1 つのジョブで、コピーを複数の場所に</template>
<template data-i18n="s-intro">ローカルディスクに書き出してからアップロードすることも、一時ディスクを使わずクラウドへ直接ストリーミングすることもできます。保持する世代数はストレージごとに設定でき、たとえばローカルに 3 世代、S3 に 30 日分を残せます。</template>
<template data-i18n="s-targets">
  <li><b>ローカル / NFS</b><span>リストアが最速。datadir とは別のディスクに</span></li>
  <li><b>S3</b><span>AWS、Cloudflare R2、MinIO、Wasabi、DigitalOcean</span></li>
  <li><b>Google Drive</b><span>OAuth またはサービスアカウント</span></li>
  <li><b>OneDrive</b><span>SharePoint にも対応</span></li>
  <li><b>FTP / FTPS</b><span>明示的 TLS・暗黙的 TLS</span></li>
  <li><b>SFTP</b><span>パスワードまたは秘密鍵</span></li>
  <li><b>WebDAV</b><span>Nextcloud など</span></li>
  <li><b>Backblaze B2</b><span>Azure Blob と Dropbox にも対応</span></li>
  <li><b>rclone</b><span>さらに 70 以上のバックエンド</span></li>
</template>
<template data-i18n="s-aside-title">標準フォーマットだから、ロックインなし</template>
<template data-i18n="s-aside-text">DumpCat を動かしていたマシンを失っても大丈夫。新しくインストールし、ストレージを追加し直して <em>Import backup catalog</em> をクリックすれば、すべてのバックアップが再び一覧に並びます。DumpCat がなくても、<code>age</code>、<code>zstd</code>、<code>mysql</code> または <code>pg_restore</code> でリストアできます。</template>
<template data-i18n="c-label">接続</template>
<template data-i18n="c-title">ポートを開けなくても、バックアップできる。</template>
<template data-i18n="c-intro">ファイアウォールや NAT、あるいは 127.0.0.1 でしか待ち受けていないといった理由で、バックアップサーバーからデータベースに直接接続できない場合は、逆にデータベースホストから DumpCat へ接続させます。方法は 2 つあり、どちらもデータベースホストのポートを開ける必要はありません。バックアップ、リストア、ポイントインタイムリカバリは直接接続のときと同じように動作します。</template>
<template data-i18n="c-agent-title">エージェント</template>
<template data-i18n="c-agent-fig" data-labels>

<template data-i18n="c-agent-facts">
  <div><dt>データベースホストに必要なもの</dt><dd>DumpCat へのアウトバウンド HTTPS</dd></div>

  Backup &amp; restore => バックアップ/リストア
  WireGuard, built in => 内蔵 WireGuard

  Database host => データベースホスト

<template data-i18n="c-wg-facts">
  <div><dt>データベースホストに必要なもの</dt><dd>標準の WireGuard と、DumpCat へのアウトバウンド UDP 51820</dd></div>
  <div><dt>データベース</dt><dd>VPN アドレスで待ち受け、データベースユーザーに 10.66.0.1 からの接続を許可</dd></div>
  <div><dt>インストール</dt><dd>WireGuard ページで有効にし、<code>dumpcat.conf</code> をコピーして <code>systemctl enable --now wg-quick@dumpcat</code></dd></div>
  <div><dt>向いているケース</dt><dd>すでに WireGuard を使っているチーム、またはデータベースネットワーク全体へのゲートウェイとして</dd></div>
</template>
<template data-i18n="c-note">接続を開くのはデータベースホスト側で、データはその中を双方向に流れます。物理バックアップ（XtraBackup / MariaBackup）は、<wbr><code>--allow-physical</code> を付けて起動したエージェント経由で動作します。WireGuard 経由の場合は、従来どおりデータベースホストに DumpCat をインストールする必要があります。</template>
<template data-i18n="o-label">運用</template>
<template data-i18n="o-title">自前のスクリプトに頼っていた部分も、すべて標準装備</template>
<template data-i18n="o-intro">どれも DumpCat に標準で含まれ、Web UI からオン・オフや調整ができます。</template>
<template data-i18n="o-list">
  <div><dt>アップロード前に暗号化</dt><dd>age（ChaCha20-Poly1305 + scrypt）があなたのサーバー上で動くので、クラウド事業者はデータを読めません。</dd></div>
  <div><dt>整合性チェック</dt><dd>すべてのファイルに <span class="nw">SHA-256</span>。検証では再読み込み、復号、展開を行い、<code>Dump completed</code> 行があるかを確認します。</dd></div>
  <div><dt>GFS 世代管理</dt><dd>N 個のバックアップ、N 日分、各日・各週・各月の最後の 1 つを保持。増分チェーンは、元のフルバックアップと一緒にしか削除されません。</dd></div>
  <div><dt>慎重なリストア</dt><dd>データベースを DROP する前に、すべてのファイルを試験的に復号します。別名でのリストアや、別のサーバー・バージョンへのリストアも可能です（MySQL 8 ↔ MariaDB、PostgreSQL 15 → 16）。</dd></div>
  <div><dt>アカウントとロール</dt><dd>admin、operator、viewer。TOTP による二要素認証、API トークン、監査ログ、ログイン失敗が続いたときのロックアウト。</dd></div>
  <div><dt>通知</dt><dd>メール、Telegram、Slack、Discord、HMAC 署名付き Webhook で、失敗時または成功時に通知します。</dd></div>
  <div><dt>ファイアウォール内のデータベース</dt><dd>データベースホスト上のエージェントが HTTPS で DumpCat に接続するか、ホストが内蔵 WireGuard に参加します。データベース側でポートを開ける必要はありません。</dd></div>
  <div><dt>セルフアップデート</dt><dd><code>dumpcat update</code> は <span class="nw">SHA-256</span> を検証し、設定をバックアップし、実行中のバックアップの完了を待ち、失敗したらロールバックします。</dd></div>
</template>

<template data-i18n="ai-setup-title">1 分で接続</template>
<template data-i18n="ai-steps">
  <li><div><b>トークンを作る</b><span>DumpCat の <em>API &amp; MCP</em> ページで <em>New token</em>。デフォルトは閲覧のみです。アシスタントにバックアップを実行させるなら <em>Full</em> を選びます。</span></div></li>
  <li><div><b>設定をコピー</b><span>サーバーのアドレスとトークンを埋め込んだ Claude Code 用コマンド、Claude Desktop 用設定、その他のクライアント用設定がそのページに表示されます。</span></div></li>
  <li><div><b>テストして質問</b><span><em>Test MCP connection</em> で、アシスタントが使うアカウント、権限、ツールを確認できます。</span></div></li>
</template>
<template data-i18n="ai-tabs-aria">AI クライアント</template>
<template data-i18n="ai-tab-other">その他の MCP クライアント</template>
<template data-i18n="ai-tab-agent">その他のエージェント</template>
<template data-i18n="ai-cc-note">アドレスとトークンを自分のものに置き換えるか、<em>API &amp; MCP</em> ページで値が入ったコマンドをコピーします。トークンを見せずにプロジェクトで共有したい場合は、環境変数からトークンを読む <code>.mcp.json</code> も同じページにあります。</template>
<template data-i18n="ai-cd-note"><em>Settings → Developer → Edit Config</em> を開いて貼り付け、Claude Desktop を再起動します。<code>dumpcat mcp</code> は Claude Desktop のあるコンピューターで動く小さな stdio ブリッジです。Linux では <code>command</code> に <code>dumpcat</code> のパスを指定し、macOS では Go でビルドします。</template>
<template data-i18n="ai-mcp-note">エンドポイント <code>/api/mcp</code>（streamable HTTP）は DumpCat に組み込まれており、追加のインストールは不要です。ローカルのコマンドしか起動できないクライアントは、環境変数 <code>DUMPCAT_MCP_URL</code> と <code>DUMPCAT_MCP_TOKEN</code> を設定して <code>dumpcat mcp</code> を使います。</template>
<template data-i18n="ai-md-note"><code>/api/docs.md</code> は Markdown で書かれた API リファレンスの全体です。サーバー自身が生成するので、動かしているバージョンと常に一致します。認証、規約、curl の例、各ルートに必要な権限まで載っています。エージェントに読ませて REST API を呼ばせるか、チャットに貼り付けます（<em>API &amp; MCP → Copy Markdown</em>）。<code>/api/mcp/tools</code> は MCP ツールを JSON で一覧にします。</template>

<template data-i18n="i-label">インストール</template>
<template data-i18n="i-title">1 分で動き出す</template>
<template data-i18n="i-intro">Linux ならコマンド 1 つ、Windows ならダウンロードしてダブルクリックするだけ。インストーラーが、マシンの起動時に開始するサービスと、データベースのバージョンに合ったバックアップツールをセットアップします。Web UI は 1 つのファイルに組み込まれています。</template>
<template data-i18n="os-aria">オペレーティングシステム</template>
<template data-i18n="copy">コピー</template>
<template data-i18n="i-linux-lead">Linux サーバーで次のコマンドを貼り付け、Enter キーを押します：</template>
<template data-i18n="i-linux-note">最新リリースをダウンロードしてチェックサムを検証し、systemd サービスとして <code>/opt/dumpcat</code> にインストールします。<code>rclone</code>、MySQL/MariaDB クライアント、対応する mariabackup または XtraBackup に加え、リポジトリにあれば mydumper も導入されます。<wbr><code>--postgres 16</code> を付けると PostgreSQL 16 のクライアントツールが追加されます。オプションは <code>sh -s --</code> の後ろに指定します：<wbr><code>--port 9090</code>、<wbr><code>--listen 127.0.0.1</code>、<wbr><code>--tls-auto</code>。</template>
<template data-i18n="i-win-1"><b>.zip をダウンロード</b></template>
<template data-i18n="i-win-dl">Windows 版をダウンロード</template>
<template data-i18n="i-win-2"><b>展開する</b>：ファイルを右クリックして <i>Extract All</i>（すべて展開）を選びます。</template>
<template data-i18n="i-win-3"><b><i>Install DumpCat</i> をダブルクリック</b>し、<i>Yes</i>（はい）を選びます。ブラウザーで DumpCat が開き、インストールウィンドウにセットアップトークンが表示されます。</template>
<template data-i18n="i-win-note">Windows 10 / 11 または Windows Server 2016 以降の 64 ビット版で、Windows サービスとして動作します。PowerShell を使いたい場合は、PowerShell（管理者）で <code>irm https://dumpcat.cc/install.ps1 | iex</code> を実行してください。MySQL 用の mydumper と XtraBackup は使えないため、数百 GB 規模のデータベースには Linux 上の DumpCat をおすすめします。</template>
<template data-i18n="i-guide">コマンドラインに慣れていない方は、<a href="/install/">ステップごとのガイド</a>（英語）をどうぞ。よくあるトラブルの対処法も載っています。</template>
<template data-i18n="i-steps-title">インストール後の手順</template>
<template data-i18n="i-steps">
  <li><div><b><code>http://&lt;server-ip&gt;:6369</code> を開く</b><span>インストーラーが表示する 1 回限りのセットアップトークンで admin アカウントを作成します（再表示：<code>dumpcat setup-token</code>）。</span></div></li>
  <li><div><b>データベースサーバーを追加</b><span>Test connection で、不足している権限と使える方式が一覧表示されます。</span></div></li>
  <li><div><b>ストレージを追加</b><span>Test を押すと、ファイルの書き込み・読み込み・削除を試します。</span></div></li>
  <li><div><b>バックアップジョブを作成</b><span>スケジュール、暗号化、ストレージ、保持ルールを選んで、Save &amp; run now をクリックします。</span></div></li>
</template>
