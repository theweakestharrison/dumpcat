<template data-i18n="lead">DumpCat est un binaire unique doté d’une interface web. Il planifie les sauvegardes, les compresse et les chiffre, en envoie des copies vers S3, Google Drive, OneDrive ou SFTP, les vérifie et restaure vos données le moment venu. Fonctionne sous Linux et Windows, entièrement hors ligne.</template>

<template data-i18n="m-label">Méthodes de sauvegarde</template>
<template data-i18n="m-title">Le bon outil pour chaque base, quelle que soit sa taille</template>
<template data-i18n="m-intro">Pour MySQL et MariaDB, DumpCat pilote <code>mysqldump</code>, <code>mydumper</code> et XtraBackup / MariaBackup. Quand vous ajoutez un serveur, <em>Test connection</em> affiche la version, le datadir, la taille de chaque base et les méthodes utilisables sur cette machine.</template>
<template data-i18n="m-table">
  <thead>
    <tr><th scope="col"></th><th scope="col">mysqldump<small>logique</small></th><th scope="col">mydumper<small>logique, parallèle</small></th><th scope="col">XtraBackup / MariaBackup<small>physique, à chaud</small></th></tr>
  </thead>
  <tbody>
    <tr><th scope="row">Verrouille la base&nbsp;?</th><td data-m="mysqldump">Pas pour InnoDB, grâce à <code>--single-transaction</code></td><td data-m="mydumper">Un verrou global de quelques millisecondes pour synchroniser les threads, puis plus aucun</td><td data-m="physique">Aucun verrou InnoDB&nbsp;; un très bref verrou de sauvegarde à la fin</td></tr>
    <tr><th scope="row">Vitesse de sauvegarde</th><td data-m="mysqldump">1 thread par base, plusieurs bases en parallèle</td><td data-m="mydumper">Multithread, tables découpées par blocs de lignes</td><td data-m="physique">La plus rapide&nbsp;: copie de fichiers multithread</td></tr>
    <tr><th scope="row">Vitesse de restauration</th><td data-m="mysqldump">La plus lente</td><td data-m="mydumper">Rapide&nbsp;: en parallèle, index créés après le chargement</td><td data-m="physique">Très rapide&nbsp;: copie de fichiers + préparation</td></tr>
    <tr><th scope="row">Incrémentale</th><td class="no" data-m="mysqldump">Non</td><td class="no" data-m="mydumper">Non</td><td class="yes" data-m="physique">Oui</td></tr>
    <tr><th scope="row">Restaurer une seule base, la renommer</th><td class="yes" data-m="mysqldump">Oui</td><td class="yes" data-m="mydumper">Oui</td><td class="no" data-m="physique">Non, l’instance entière</td></tr>
    <tr class="fit"><th scope="row">Idéal pour</th><td data-m="mysqldump">Bases de moins de 20–50 Go</td><td data-m="mydumper">Grosses bases restaurées une par une</td><td data-m="physique">De 100 Go à plusieurs To, RTO court</td></tr>
  </tbody>
</template>
<template data-i18n="m-pg"><b>PostgreSQL</b> 10 et plus&nbsp;: <code>pg_dump</code> par base, avec export et restauration des tables en parallèle, sous un nouveau nom ou sur un autre serveur&nbsp;; <code>pg_basebackup</code> pour tout le cluster via une connexion de réplication, avec archivage WAL continu pour revenir à une heure donnée, à un point de restauration ou à une position WAL.</template>
<template data-i18n="s-label">Stockage</template>
<template data-i18n="s-title">Une tâche, des copies à plusieurs endroits</template>
<template data-i18n="s-intro">Écrivez sur le disque local puis téléversez, ou envoyez le flux directement vers le cloud, sans disque temporaire. Chaque stockage conserve son propre nombre de copies, par exemple 3 sauvegardes en local et 30 jours sur S3.</template>
<template data-i18n="s-targets">
  <li><b>Local / NFS</b><span>Le plus rapide pour restaurer&nbsp;; à garder hors du disque du datadir</span></li>
  <li><b>S3</b><span>AWS, Cloudflare R2, MinIO, Wasabi, DigitalOcean</span></li>
  <li><b>Google Drive</b><span>OAuth ou compte de service</span></li>
  <li><b>OneDrive</b><span>SharePoint inclus</span></li>
  <li><b>FTP / FTPS</b><span>TLS explicite ou implicite</span></li>
  <li><b>SFTP</b><span>Mot de passe ou clé privée</span></li>
  <li><b>WebDAV</b><span>Nextcloud et compagnie</span></li>
  <li><b>Backblaze B2</b><span>Ainsi qu’Azure Blob et Dropbox</span></li>
  <li><b>rclone</b><span>Plus de 70 autres backends</span></li>
</template>
<template data-i18n="s-aside-title">Formats standard, aucun enfermement</template>
<template data-i18n="s-aside-text">Vous avez perdu la machine qui fait tourner DumpCat&nbsp;? Installez une nouvelle copie, rajoutez le stockage et cliquez sur <em>Import backup catalog</em>&nbsp;: toutes les sauvegardes réapparaissent. Même sans DumpCat, vous pouvez restaurer avec <code>age</code>, <code>zstd</code> et <code>mysql</code> ou <code>pg_restore</code>.</template>
<template data-i18n="c-label">Connectivité</template>
<template data-i18n="c-title">Base sans port ouvert&nbsp;? Sauvegardée quand même.</template>
<template data-i18n="c-intro">Quand le serveur de sauvegarde ne peut pas joindre la base directement, à cause d’un pare-feu, d’un NAT ou d’une base qui n’écoute que sur 127.0.0.1, c’est le serveur de base de données qui se connecte à DumpCat. Il y a deux façons de faire, et aucune n’ouvre de port sur ce serveur. Sauvegardes, restaurations et restauration à un instant précis fonctionnent comme avec une connexion directe.</template>

<template data-i18n="o-label">Exploitation</template>
<template data-i18n="o-title">Tout ce que vous auriez dû scripter vous-même</template>
<template data-i18n="o-intro">Tout est inclus dans DumpCat, et s’active et se règle depuis l’interface web.</template>
<template data-i18n="o-list">
  <div><dt>Chiffré avant l’envoi</dt><dd>age (ChaCha20-Poly1305 + scrypt) tourne sur votre serveur&nbsp;: le fournisseur cloud ne peut pas lire vos données.</dd></div>
  <div><dt>Contrôles d’intégrité</dt><dd><span class="nw">SHA-256</span> pour chaque fichier. La vérification relit, déchiffre, décompresse et cherche la ligne <code>Dump completed</code>.</dd></div>
  <div><dt>Rétention GFS</dt><dd>Gardez N sauvegardes, N jours, la dernière de chaque jour, semaine et mois. Une chaîne incrémentale n’est supprimée qu’avec sa sauvegarde complète.</dd></div>
  <div><dt>Restaurations prudentes</dt><dd>Chaque fichier passe un test de déchiffrement avant la suppression de la moindre base. Restaurez sous de nouveaux noms, ou sur un autre serveur et une autre version (MySQL 8 ↔ MariaDB, PostgreSQL 15 → 16).</dd></div>
  <div><dt>Comptes et rôles</dt><dd>admin, operator, viewer. Double authentification TOTP, jetons d’API, journal d’audit et verrouillage après des échecs de connexion répétés.</dd></div>
  <div><dt>Notifications</dt><dd>E-mail, Telegram, Slack, Discord et webhooks signés HMAC, en cas d’échec ou de succès.</dd></div>
  <div><dt>Bases derrière un pare-feu</dt><dd>Un agent sur le serveur de base de données se connecte à DumpCat en HTTPS, ou le serveur rejoint le WireGuard intégré. Aucun port à ouvrir vers la base.</dd></div>
  <div><dt>Mise à jour intégrée</dt><dd><code>dumpcat update</code> vérifie le <span class="nw">SHA-256</span>, sauvegarde la configuration, attend la fin des sauvegardes en cours et revient en arrière en cas d’échec.</dd></div>
</template>

<template data-i18n="ai-title">Confiez la mise en place et la surveillance des sauvegardes à un assistant IA, sans lui donner les clés</template>
<template data-i18n="ai-intro">DumpCat est un serveur MCP. Connectez Claude Code, Claude Desktop ou un autre client MCP avec un jeton d’API, puis demandez en langage courant&nbsp;: l’assistant ajoute des serveurs et des stockages, crée des tâches et des exercices de restauration, cherche ce qui a échoué ou pris du retard, lit le journal et vous explique pourquoi. Les mots de passe et les clés, c’est vous qui les saisissez dans l’interface web. Les autres agents IA lisent la référence d’API en Markdown que votre propre serveur rédige pour eux.</template>

<template data-i18n="ai-perm-look"><b>Regarder</b><small>Jeton en lecture seule, par défaut</small><span>Vue d’ensemble et alertes, tâches, sauvegardes, erreurs et journaux, archivage binlog / WAL, résultats des restaurations et des exercices, aperçus de restauration à un instant précis.</span></template>

<template data-i18n="ai-perm-never"><b>Jamais via MCP</b><small>Quel que soit le jeton</small><span>Restaurations, suppressions et réglages de DumpCat. Aucune option ne les active&nbsp;: tout cela se fait dans l’interface web.</span></template>

<template data-i18n="ai-cd-note">Ouvrez <em>Settings → Developer → Edit Config</em>, collez, puis redémarrez Claude Desktop. <code>dumpcat mcp</code> est une petite passerelle stdio qui tourne sur l’ordinateur où se trouve Claude Desktop&nbsp;; sous Linux, <code>command</code> est le chemin du binaire <code>dumpcat</code>, et sous macOS vous le compilez avec Go.</template>
<template data-i18n="ai-mcp-note">L’endpoint <code>/api/mcp</code> (streamable HTTP) fait partie de DumpCat, rien d’autre à installer. Les clients qui ne savent lancer qu’une commande locale utilisent <code>dumpcat mcp</code>, avec <code>DUMPCAT_MCP_URL</code> et <code>DUMPCAT_MCP_TOKEN</code> dans l’environnement.</template>
<template data-i18n="ai-md-note"><code>/api/docs.md</code> est toute la référence d’API en Markdown, rédigée par le serveur lui-même, donc toujours conforme à la version que vous utilisez&nbsp;: authentification, conventions, exemples curl et chaque route avec l’accès requis. Laissez un agent la lire et appeler l’API REST, ou collez-la dans un chat (<em>API &amp; MCP → Copy Markdown</em>). <code>/api/mcp/tools</code> liste les outils MCP en JSON.</template>

<template data-i18n="i-label">Installation</template>
<template data-i18n="i-title">Opérationnel en une minute</template>
<template data-i18n="i-intro">Une commande sous Linux, un téléchargement et un double-clic sous Windows. L’installateur met en place un service qui démarre avec la machine, ainsi que les outils de sauvegarde adaptés à la version de votre base&nbsp;; l’interface web est intégrée dans un seul fichier.</template>
<template data-i18n="os-aria">Système d’exploitation</template>
<template data-i18n="copy">Copier</template>
<template data-i18n="i-linux-lead">Sur le serveur Linux, collez cette commande et appuyez sur Entrée&nbsp;:</template>
<template data-i18n="i-linux-note">Elle télécharge la dernière version, vérifie sa somme de contrôle et l’installe dans <code>/opt/dumpcat</code> comme service systemd, avec <code>rclone</code>, le client MySQL/MariaDB, le mariabackup ou XtraBackup correspondant, et mydumper s’il est dans les dépôts&nbsp;; <code>--postgres 16</code> ajoute les outils client de PostgreSQL 16. Les options se placent après <code>sh -s --</code>&nbsp;: <code>--port 9090</code>, <code>--listen 127.0.0.1</code>, <code>--tls-auto</code>.</template>
<template data-i18n="i-win-1"><b>Téléchargez le .zip</b></template>
<template data-i18n="i-win-dl">Télécharger pour Windows</template>
<template data-i18n="i-win-2"><b>Décompressez-le</b>&nbsp;: clic droit sur le fichier, puis <i>Extract All</i> (Extraire tout).</template>
<template data-i18n="i-win-3"><b>Double-cliquez sur <i>Install DumpCat</i></b> et répondez <i>Yes</i> (Oui). Votre navigateur ouvre DumpCat&nbsp;; la fenêtre d’installation affiche le jeton de configuration.</template>
<template data-i18n="i-win-note">Windows 10 / 11 ou Windows Server 2016+ 64 bits, fonctionne comme service Windows. Vous préférez PowerShell&nbsp;? Lancez <code>irm https://dumpcat.cc/install.ps1 | iex</code> dans PowerShell (administrateur). mydumper et XtraBackup pour MySQL ne sont pas disponibles&nbsp;; faites tourner DumpCat sous Linux pour des bases de plusieurs centaines de Go.</template>
<template data-i18n="i-guide">Peu habitué à la ligne de commande&nbsp;? <a href="/install/">Suivez le guide pas à pas</a> (en anglais), avec des solutions aux problèmes courants.</template>
<template data-i18n="i-steps-title">Après l’installation</template>
<template data-i18n="i-steps">
  <li><div><b>Ouvrez <code>http://&lt;server-ip&gt;:6369</code></b><span>Créez le compte admin avec le jeton de configuration à usage unique affiché par l’installateur (pour le réafficher&nbsp;: <code>dumpcat setup-token</code>).</span></div></li>
  <li><div><b>Ajoutez un serveur de base de données</b><span>Le bouton Test connection liste les privilèges manquants et les méthodes utilisables.</span></div></li>
  <li><div><b>Ajoutez un stockage</b><span>Le bouton Test écrit, lit et supprime un fichier.</span></div></li>
  <li><div><b>Créez une tâche de sauvegarde</b><span>Choisissez la planification, le chiffrement, le stockage et la rétention, puis cliquez sur Save &amp; run now.</span></div></li>
</template>
<template data-i18n="meow-title">Le port 6369 s’écrit <em>MEOW</em></template>
<template data-i18n="meow">Tapez 6-3-6-9 sur le clavier d’un téléphone et vous obtenez MEOW, «&nbsp;miaou&nbsp;» en anglais. C’est le port par défaut de l’interface web.</template>
