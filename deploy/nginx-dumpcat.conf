# Example nginx reverse proxy for DumpCat (HTTPS with Let's Encrypt).
# Set DUMPCAT_LISTEN=127.0.0.1:6369 and DUMPCAT_TRUST_PROXY=1 in /etc/dumpcat/dumpcat.env
server {
    listen 80;
    server_name backup.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name backup.example.com;

    ssl_certificate     /etc/letsencrypt/live/backup.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backup.example.com/privkey.pem;

    # Optional: restrict access to your office/VPN
    # allow 203.0.113.0/24;
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:6369;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # large backup downloads are streamed
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 8m;
    }
}
