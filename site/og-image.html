<!doctype html>
<!-- Source of og.png (1200x630), the social preview of dumpcat.cc. Not deployed (see .assetsignore).
     Render: chrome --headless=new --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630
             --virtual-time-budget=8000 --screenshot=site/og.png site/og-image.html   (see docs/website.vi.md) -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=JetBrains+Mono:wght@400;600&display=block">
<style>
  :root {
    --brand: #1f5fbf;
    --brand-deep: #174a96;
    --on-brand: #ffffff;
    --on-brand-2: rgba(255, 255, 255, 0.80);
    --on-brand-line: rgba(255, 255, 255, 0.28);
    --ink: #0e1116;
    --muted: #6b6963;
    --sunken: #eeede8;
    --accent: #2368c4;
    --binlog: #c9dcf5;
    --binlog-seg: rgba(28, 86, 176, 0.28);
    --danger: #d03b3b;
    --danger-ink: #a32424;
    --display: "Bricolage Grotesque", "Be Vietnam Pro", system-ui, sans-serif;
    --body: "Be Vietnam Pro", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: radial-gradient(900px 520px at 88% 8%, rgba(255, 255, 255, 0.10), transparent 70%), var(--brand);
    color: var(--on-brand);
    font-family: var(--body);
    -webkit-font-smoothing: antialiased;
  }
  .og { height: 630px; padding: 46px 64px 44px; display: grid; grid-template-rows: auto 1fr auto; }

  .top { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 14px; font: 700 34px/1 var(--display); font-variation-settings: "wdth" 88; letter-spacing: -0.01em; }
  .brand svg { width: 48px; height: 48px; border-radius: 11px; box-shadow: 0 0 0 1px var(--on-brand-line); }
  .site { font: 600 22px/1 var(--mono); color: var(--on-brand-2); letter-spacing: 0.02em; }

  .main { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 40px; }
  .eyebrow { margin: 0 0 16px; font: 600 17px/1.3 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--on-brand-2); }
  h1 { margin: 0; font: 760 66px/1.03 var(--display); font-variation-settings: "wdth" 82; letter-spacing: -0.025em; text-wrap: balance; }
  h1 span { display: block; color: var(--on-brand-2); }
  .mark { width: 228px; filter: drop-shadow(0 14px 26px rgba(4, 20, 50, 0.32)); margin-right: 6px; }
  .mark svg { display: block; width: 100%; height: auto; }

  .card { background: #fff; color: var(--ink); border-radius: 18px; padding: 18px 24px 20px; box-shadow: 0 24px 60px rgba(9, 30, 66, 0.30); }
  .card-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
  .card-head b { font: 700 22px/1 var(--display); font-variation-settings: "wdth" 90; letter-spacing: -0.01em; }
  .card-head span { font: 500 16px/1 var(--mono); color: var(--muted); }
  .track { position: relative; height: 54px; background: var(--sunken); border-radius: 10px; }
  .stream { position: absolute; left: 0; width: 90.7%; bottom: 10px; height: 16px; border-radius: 3px 0 0 3px;
    background: linear-gradient(90deg, transparent calc(100% - 1px), var(--binlog-seg) 0) 0 0 / 1.53% 100% repeat-x, var(--binlog); }
  .replay { position: absolute; left: 11.1%; width: calc(70.1% - 14px); bottom: 10px; height: 16px; background: var(--accent); }
  .pin { position: absolute; left: 11.1%; top: 0; bottom: 0; border-left: 2px solid var(--ink); }
  .pin span { position: absolute; top: 7px; left: 6px; white-space: nowrap; font: 600 14px/1 var(--mono); color: #fff; background: var(--ink); padding: 4px 7px; border-radius: 4px; }
  .incident { position: absolute; left: 81.2%; top: 0; bottom: 0; border-left: 2px solid var(--danger); }
  .incident span { position: absolute; right: 28px; top: 8px; white-space: nowrap; font: 600 14px/1 var(--mono); color: var(--danger-ink); }
  .thumb { position: absolute; left: calc(81.2% - 20px); top: -3px; bottom: -3px; width: 12px; border-radius: 6px; background: var(--accent); border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="dc-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a86e8"/><stop offset="1" stop-color="#1c56b0"/></linearGradient>
    <symbol id="dc-logo" viewBox="0 0 64 64"><rect width="64" height="64" rx="15" fill="url(#dc-bg)"/><path d="M47.5 45.5c7.5 0 10.5-5.5 7.8-11.5" fill="none" stroke="#fff" stroke-width="4.2" stroke-linecap="round"/><path d="M15.6 25 18.4 7.6 30.5 17.5z" fill="#fff"/><path d="M48.4 25 45.6 7.6 33.5 17.5z" fill="#fff"/><path d="M19.4 18.6 20.4 12.4 25.6 16.4z" fill="#f9a8c9"/><path d="M44.6 18.6 43.6 12.4 38.4 16.4z" fill="#f9a8c9"/><path d="M15 21v24c0 3.9 7.6 7 17 7s17-3.1 17-7V21z" fill="#fff"/><ellipse cx="32" cy="21" rx="17" ry="7" fill="#d6e6fb"/><path d="M15 38c0 3.9 7.6 7 17 7s17-3.1 17-7" fill="none" stroke="#1c56b0" stroke-opacity=".28" stroke-width="2.4"/><circle cx="25.4" cy="31" r="2.5" fill="#1b2433"/><circle cx="38.6" cy="31" r="2.5" fill="#1b2433"/><path d="M30.1 34.2h3.8L32 36.4z" fill="#f27aa8"/></symbol>
  </defs>
</svg>
<div class="og">
  <div class="top">
    <div class="brand"><svg aria-hidden="true"><use href="#dc-logo"/></svg>DumpCat</div>
    <div class="site">dumpcat.cc</div>
  </div>
  <div class="main">
    <div>
      <p class="eyebrow">Backup &amp; restore for MySQL and MariaDB</p>
      <h1>Backups that never lock the database. <span>Recovery to the exact second.</span></h1>
    </div>
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 64 64"><use href="#dc-logo"/></svg></div>
  </div>
  <div class="card">
    <div class="card-head"><b>Point-in-time recovery</b><span>open source · Linux &amp; Windows</span></div>
    <div class="track">
      <div class="stream"></div>
      <div class="replay"></div>
      <div class="pin"><span>full · 02:00</span></div>
      <div class="incident"><span>DROP TABLE orders · 14:37:12</span></div>
      <div class="thumb"></div>
    </div>
  </div>
</div>
</body>
</html>
