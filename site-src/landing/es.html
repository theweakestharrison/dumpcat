<template data-i18n="h1">Copias de seguridad sin bloquear la base de datos. <span class="soft">Recuperación al segundo exacto.</span></template>
<template data-i18n="lead">DumpCat es un solo binario con interfaz web. Programa las copias de seguridad, las comprime y las cifra, envía copias a S3, Google Drive, OneDrive o SFTP, las verifica y recupera tus datos cuando los necesitas. Funciona en Linux y Windows, totalmente sin conexión a internet.</template>

<template data-i18n="m-label">Métodos de copia</template>
<template data-i18n="m-title">La herramienta adecuada para cada base de datos y tamaño</template>
<template data-i18n="m-intro">Para MySQL y MariaDB, DumpCat utiliza <code>mysqldump</code>, <code>mydumper</code> y XtraBackup / MariaBackup. Al agregar un servidor, <em>Test connection</em> muestra la versión, el datadir, el tamaño de cada base de datos y qué métodos funcionan en esa máquina.</template>
<template data-i18n="m-table">
  <thead>
    <tr><th scope="col"></th><th scope="col">mysqldump<small>lógico</small></th><th scope="col">mydumper<small>lógico, paralelo</small></th><th scope="col">XtraBackup / MariaBackup<small>físico, en caliente</small></th></tr>
  </thead>
  <tbody>
    <tr><th scope="row">¿Bloquea la base de datos?</th><td data-m="mysqldump">No en InnoDB, gracias a <code>--single-transaction</code></td><td data-m="mydumper">Un bloqueo global de unos milisegundos para sincronizar los hilos, después ninguno</td><td data-m="físico">Sin bloqueos de InnoDB; un bloqueo de copia muy breve al final</td></tr>
    <tr><th scope="row">Velocidad de copia</th><td data-m="mysqldump">1 hilo por base de datos, varias bases de datos en paralelo</td><td data-m="mydumper">Multihilo, tablas divididas por filas</td><td data-m="físico">La más rápida: copia de archivos multihilo</td></tr>
    <tr><th scope="row">Velocidad de restauración</th><td data-m="mysqldump">La más lenta</td><td data-m="mydumper">Rápida: en paralelo, índices creados tras la carga</td><td data-m="físico">Muy rápida: copia de archivos + prepare</td></tr>
    <tr><th scope="row">Incremental</th><td class="no" data-m="mysqldump">No</td><td class="no" data-m="mydumper">No</td><td class="yes" data-m="físico">Sí</td></tr>
    <tr><th scope="row">Restaurar una sola base de datos, con otro nombre</th><td class="yes" data-m="mysqldump">Sí</td><td class="yes" data-m="mydumper">Sí</td><td class="no" data-m="físico">No, la instancia completa</td></tr>
    <tr class="fit"><th scope="row">Ideal para</th><td data-m="mysqldump">Bases de datos de menos de 20–50 GB</td><td data-m="mydumper">Bases de datos grandes que se restauran de una en una</td><td data-m="físico">De 100 GB a varios TB, RTO bajo</td></tr>
  </tbody>
</template>
<template data-i18n="m-pg"><b>PostgreSQL</b> 10 y posteriores: <code>pg_dump</code> por base de datos, con volcado y restauración de tablas en paralelo, con otro nombre o en otro servidor; <code>pg_basebackup</code> para todo el clúster a través de una conexión de replicación, con archivado continuo de WAL para recuperar hasta un momento, un punto de restauración o una posición del WAL.</template>
<template data-i18n="s-label">Almacenamiento</template>
<template data-i18n="s-title">Un trabajo, copias en varios lugares</template>
<template data-i18n="s-intro">Guarda en el disco local y luego sube la copia, o envíala directamente a la nube sin disco temporal. Cada almacenamiento conserva su propio número de copias, por ejemplo 3 copias en local y 30 días en S3.</template>
<template data-i18n="s-targets">
  <li><b>Local / NFS</b><span>La restauración más rápida; mejor fuera del disco del datadir</span></li>
  <li><b>S3</b><span>AWS, Cloudflare R2, MinIO, Wasabi, DigitalOcean</span></li>
  <li><b>Google Drive</b><span>OAuth o una cuenta de servicio</span></li>
  <li><b>OneDrive</b><span>SharePoint incluido</span></li>
  <li><b>FTP / FTPS</b><span>TLS explícito o implícito</span></li>
  <li><b>SFTP</b><span>Contraseña o clave privada</span></li>
  <li><b>WebDAV</b><span>Nextcloud y similares</span></li>
  <li><b>Backblaze B2</b><span>Además de Azure Blob y Dropbox</span></li>
  <li><b>rclone</b><span>Más de 70 backends adicionales</span></li>
</template>
<template data-i18n="s-aside-title">Formatos estándar, sin ataduras</template>
<template data-i18n="s-aside-text">¿Se perdió la máquina donde se ejecutaba DumpCat? Instala DumpCat de nuevo, vuelve a agregar el almacenamiento y haz clic en <em>Import backup catalog</em>: todas las copias vuelven a aparecer. Sin DumpCat también puedes restaurar con <code>age</code>, <code>zstd</code> y <code>mysql</code> o <code>pg_restore</code>.</template>
<template data-i18n="c-label">Conectividad</template>
<template data-i18n="c-title">¿Base de datos sin puertos abiertos? También tiene copia de seguridad.</template>
<template data-i18n="c-intro">Cuando el servidor de copias de seguridad no puede conectarse directamente a la base de datos, por un firewall, NAT o una base de datos que solo escucha en 127.0.0.1, deja que sea el servidor de base de datos el que se conecte a DumpCat. Hay dos maneras, y ninguna abre un puerto en el servidor de base de datos. Las copias de seguridad, las restauraciones y la recuperación a un punto en el tiempo funcionan igual que con una conexión directa.</template>

<template data-i18n="c-wg-facts">
  <div><dt>El servidor de base de datos necesita</dt><dd>WireGuard estándar, UDP 51820 saliente hacia DumpCat</dd></div>
  <div><dt>Base de datos</dt><dd>Escucha en la dirección de la VPN y el usuario acepta conexiones desde 10.66.0.1</dd></div>

<template data-i18n="o-label">Operaciones</template>
<template data-i18n="o-title">Lo que de otro modo tendrías que programar tú mismo</template>
<template data-i18n="o-intro">Todo viene incluido en DumpCat y se activa y ajusta desde la interfaz web.</template>
<template data-i18n="o-list">
  <div><dt>Cifrado antes de subir</dt><dd>age (ChaCha20-Poly1305 + scrypt) se ejecuta en tu servidor, así que el proveedor de la nube no puede leer tus datos.</dd></div>
  <div><dt>Comprobación de integridad</dt><dd><span class="nw">SHA-256</span> para cada archivo. La verificación vuelve a leer, descifra, descomprime y busca la línea <code>Dump completed</code>.</dd></div>
  <div><dt>Retención GFS</dt><dd>Conserva N copias, N días, la última de cada día, semana y mes. Las cadenas incrementales solo se eliminan junto con su copia completa.</dd></div>
  <div><dt>Restauraciones cuidadosas</dt><dd>Se comprueba que cada archivo se puede descifrar antes de eliminar cualquier base de datos. Restaura con otros nombres, o en otro servidor y otra versión (MySQL 8 ↔ MariaDB, PostgreSQL 15 → 16).</dd></div>
  <div><dt>Cuentas y roles</dt><dd>admin, operator, viewer. Doble factor TOTP, tokens de API, un registro de auditoría y bloqueo tras varios inicios de sesión fallidos.</dd></div>
  <div><dt>Notificaciones</dt><dd>Correo electrónico, Telegram, Slack, Discord y webhooks firmados con HMAC, en caso de fallo o de éxito.</dd></div>
  <div><dt>Bases de datos tras un firewall</dt><dd>Un agente en el servidor de base de datos se conecta a DumpCat por HTTPS, o el servidor se une al WireGuard integrado. No hace falta abrir ningún puerto hacia la base de datos.</dd></div>
  <div><dt>Autoactualización</dt><dd><code>dumpcat update</code> comprueba el <span class="nw">SHA-256</span>, hace una copia de la configuración, espera a que terminen las copias en curso y revierte los cambios si algo falla.</dd></div>
</template>

<template data-i18n="ai-label">Pensado para IA</template>
<template data-i18n="ai-title">Pensado para IA: deja que tu asistente vigile las copias de seguridad</template>
<template data-i18n="ai-intro">DumpCat incluye un servidor MCP y una referencia de la API escrita en Markdown. Claude Code, Claude Desktop y otros agentes de IA se conectan con un token de API para preguntar qué copias fallaron, leer los registros y explicar por qué; con un token de acceso completo también pueden lanzar copias, verificaciones y simulacros de restauración.</template>
<template data-i18n="ai-list">
  <div><dt>Servidor MCP integrado</dt><dd>El endpoint <code>/api/mcp</code> forma parte de DumpCat, no hay que instalar nada más: herramientas para el resumen general, las alertas, los trabajos, las copias, los registros, las restauraciones, los simulacros y las vistas previas de recuperación a un punto en el tiempo. Los clientes que inician un servidor local por stdio usan <code>dumpcat mcp</code>.</dd></div>
  <div><dt>Seguro por defecto</dt><dd>Los tokens nuevos solo pueden consultar. Las restauraciones, los borrados, las credenciales y la configuración nunca pasan por MCP; las respuestas omiten contraseñas, claves y tokens, y todo lo que inicia un asistente queda en el registro de auditoría.</dd></div>
  <div><dt>Una referencia de la API en Markdown</dt><dd><code>/api/docs.md</code> lo genera el propio servidor: autenticación, convenciones, ejemplos con curl y cada ruta con el rol y el token que necesita. Pégalo en un chat de IA o deja que un agente lo lea y llame a la API REST.</dd></div>
  <div><dt>Listo en un minuto</dt><dd>La página <em>API &amp; MCP</em> de DumpCat crea el token, te da el comando para Claude Code y la configuración para Claude Desktop y otros clientes, además de un botón <em>Test</em> para comprobar la conexión.</dd></div>
</template>

<template data-i18n="i-linux-lead">En el servidor Linux, pega este comando y presiona Enter:</template>
<template data-i18n="i-linux-note">Descarga la última versión, comprueba su suma de verificación y la instala en <code>/opt/dumpcat</code> como servicio systemd, con <code>rclone</code>, el cliente de MySQL/MariaDB, el mariabackup o XtraBackup correspondiente y mydumper cuando los repositorios lo incluyen; <code>--postgres 16</code> agrega las herramientas cliente de PostgreSQL 16. Las opciones van después de <code>sh -s --</code>: <code>--port 9090</code>, <code>--listen 127.0.0.1</code>, <code>--tls-auto</code>.</template>
