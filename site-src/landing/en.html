<template data-i18n="h1">Backups that never lock the database. <span class="soft">Recovery to the exact second.</span></template>
<template data-i18n="lead">DumpCat is a single binary with a web UI. It schedules backups, compresses and encrypts them, ships copies to S3, Google Drive, OneDrive or SFTP, verifies them and brings your data back when you need it. Runs on Linux and Windows, fully offline.</template>

<template data-i18n="m-label">Backup methods</template>
<template data-i18n="m-title">The right tool for each database and size</template>
<template data-i18n="m-intro">For MySQL and MariaDB, DumpCat drives <code>mysqldump</code>, <code>mydumper</code> and XtraBackup / MariaBackup. When you add a server, <em>Test connection</em> shows the version, datadir, the size of each database and which methods work on that machine.</template>
<template data-i18n="m-table">
  <thead>
    <tr><th scope="col"></th><th scope="col">mysqldump<small>logical</small></th><th scope="col">mydumper<small>logical, parallel</small></th><th scope="col">XtraBackup / MariaBackup<small>physical, hot</small></th></tr>
  </thead>
  <tbody>
    <tr><th scope="row">Locks the database?</th><td data-m="mysqldump">Not for InnoDB, thanks to <code>--single-transaction</code></td><td data-m="mydumper">A global lock for a few milliseconds to sync threads, then none</td><td data-m="physical">No InnoDB locking; a very brief backup lock at the end</td></tr>
    <tr><th scope="row">Backup speed</th><td data-m="mysqldump">1 thread per database, several databases in parallel</td><td data-m="mydumper">Multi-threaded, tables chunked by rows</td><td data-m="physical">Fastest: multi-threaded file copy</td></tr>
    <tr><th scope="row">Restore speed</th><td data-m="mysqldump">Slowest</td><td data-m="mydumper">Fast: parallel, indexes built after load</td><td data-m="physical">Very fast: file copy + prepare</td></tr>
    <tr><th scope="row">Incremental</th><td class="no" data-m="mysqldump">No</td><td class="no" data-m="mydumper">No</td><td class="yes" data-m="physical">Yes</td></tr>
    <tr><th scope="row">Restore one database, rename</th><td class="yes" data-m="mysqldump">Yes</td><td class="yes" data-m="mydumper">Yes</td><td class="no" data-m="physical">No, whole instance</td></tr>
    <tr class="fit"><th scope="row">Best for</th><td data-m="mysqldump">Databases under 20–50 GB</td><td data-m="mydumper">Large databases restored one at a time</td><td data-m="physical">100 GB to several TB, low RTO</td></tr>
  </tbody>
</template>
<template data-i18n="m-pg"><b>PostgreSQL</b> 10 and newer: <code>pg_dump</code> per database, with tables dumped and restored in parallel, under a new name or onto another server; <code>pg_basebackup</code> for the whole cluster over a replication connection, with continuous WAL archiving to recover to a time, a restore point or a WAL position.</template>
<template data-i18n="m-ms"><b>SQL Server</b> 2012 and newer, on Windows, Linux and in containers: native full and differential backups with <code>BACKUP DATABASE</code> (no client tools to install), restores under a new name or onto another server, restore drills with <code>DBCC CHECKDB</code>, and scheduled log backups for recovery to a point in time, a marked transaction or an LSN. SQL Server writes its backups on its own host: DumpCat reads them from a shared folder, or an agent on that host moves them and nothing is shared.</template>
<template data-i18n="s-label">Storage</template>
<template data-i18n="s-title">One job, copies in several places</template>
<template data-i18n="s-intro">Write to local disk and then upload, or stream straight to the cloud with no temporary disk. Each storage keeps its own number of copies, for example 3 backups locally and 30 days on S3.</template>
<template data-i18n="s-targets">
  <li><b>Local / NFS</b><span>Fastest to restore from; keep it off the datadir disk</span></li>
  <li><b>S3</b><span>AWS, Cloudflare R2, MinIO, Wasabi, DigitalOcean</span></li>
  <li><b>Google Drive</b><span>OAuth or a Service Account</span></li>
  <li><b>OneDrive</b><span>SharePoint included</span></li>
  <li><b>FTP / FTPS</b><span>Explicit or Implicit TLS</span></li>
  <li><b>SFTP</b><span>Password or private key</span></li>
  <li><b>WebDAV</b><span>Nextcloud and friends</span></li>
  <li><b>Backblaze B2</b><span>Plus Azure Blob and Dropbox</span></li>
  <li><b>rclone</b><span>70+ more backends</span></li>
</template>
<template data-i18n="s-aside-title">Standard formats, no lock-in</template>
<template data-i18n="s-aside-text">Lost the machine running DumpCat? Install a fresh copy, add the storage again and click <em>Import backup catalog</em>: every backup is listed again. Without DumpCat you can still restore with <code>age</code>, <code>zstd</code> and <code>mysql</code>, <code>pg_restore</code> or SQL Server’s <code>RESTORE DATABASE</code>.</template>
<template data-i18n="c-label">Connectivity</template>
<template data-i18n="c-title">Database with no open port? Still backed up.</template>
<template data-i18n="c-intro">When the backup server cannot connect to the database directly, because of a firewall, NAT or a database listening on 127.0.0.1 only, let the database host connect out to DumpCat instead. There are two ways, and neither opens a port on the database host. Backups, restores and point-in-time recovery work as with a direct connection.</template>

<template data-i18n="c-wg-facts">
  <div><dt>The database host needs</dt><dd>Standard WireGuard, outbound UDP 51820 to DumpCat</dd></div>
  <div><dt>Database</dt><dd>Listens on the VPN address, the user allows 10.66.0.1</dd></div>
  <div><dt>Install</dt><dd>Turn it on on the WireGuard page, copy <code>dumpcat.conf</code>, <code>systemctl enable --now wg-quick@dumpcat</code></dd></div>
  <div><dt>Good for</dt><dd>Teams that already use WireGuard, or a gateway to a whole database network</dd></div>
</template>
<template data-i18n="c-note">The database host opens the connection; the data flows both ways inside it. Physical backups (XtraBackup / MariaBackup) work through an agent started with <code>--allow-physical</code>; through WireGuard they still need DumpCat installed on the database host. SQL Server’s backup files also go through an agent, started with <code>--allow-mssql-dir</code>: no shared folder needed.</template>
<template data-i18n="o-label">Operations</template>
<template data-i18n="o-title">The parts you would otherwise script yourself</template>
<template data-i18n="o-intro">All of it ships with DumpCat and is switched on and tuned from the web UI.</template>
<template data-i18n="o-list">
  <div><dt>Encrypted before upload</dt><dd>age (ChaCha20-Poly1305 + scrypt) runs on your server, so the cloud provider cannot read your data.</dd></div>
  <div><dt>Integrity checks</dt><dd><span class="nw">SHA-256</span> for every file. Verify re-reads, decrypts, decompresses and looks for the <code>Dump completed</code> line.</dd></div>
  <div><dt>GFS retention</dt><dd>Keep N backups, N days, the last one of each day, week and month. Incremental chains go only with their full.</dd></div>
  <div><dt>Careful restores</dt><dd>Every file is test-decrypted before any database is dropped. Restore under new names, or onto another server and version (MySQL 8 ↔ MariaDB, PostgreSQL 15 → 16).</dd></div>
  <div><dt>Accounts and roles</dt><dd>admin, operator, viewer. TOTP two-factor, API tokens, an audit log and lockout after repeated failed logins.</dd></div>
  <div><dt>Notifications</dt><dd>Email, Telegram, Slack, Discord and HMAC-signed webhooks, on failure or on success.</dd></div>
  <div><dt>Databases behind a firewall</dt><dd>An agent on the database host connects out to DumpCat over HTTPS, or the host joins the built-in WireGuard. No port has to be opened to the database.</dd></div>
  <div><dt>Self-update</dt><dd><code>dumpcat update</code> checks <span class="nw">SHA-256</span>, backs up the configuration, waits for running backups and rolls back on failure.</dd></div>
</template>
<template data-i18n="oss-label">Open source</template>
<template data-i18n="oss-title">Free, open source, and your data stays yours</template>
<template data-i18n="oss-intro">DumpCat is released under the Apache-2.0 license. No account, no license key, no paid edition holding features back: everything on this page is in the build you download.</template>
<template data-i18n="oss-list">
  <div><dt>Apache-2.0 license</dt><dd>Use it at home or at work, modify it and redistribute it. The full text is in <a href="https://github.com/theweakestharrison/DumpCat/blob/main/LICENSE">LICENSE</a>.</dd></div>
  <div><dt>No telemetry</dt><dd>DumpCat sends no usage data anywhere. The only call it makes on its own is reading <code>latest.json</code> once a day to announce new versions, and you can switch that off in Settings.</dd></div>
  <div><dt>No middleman</dt><dd>Backups, database passwords and encryption keys travel only from your server to the storage you choose.</dd></div>
  <div><dt>Signed releases</dt><dd>Every update is signed with ed25519 and checked against <span class="nw">SHA-256</span> before it is installed. Building it yourself only takes Go.</dd></div>
</template>

<template data-i18n="ai-title">Let an AI assistant set up and watch your backups, without handing over the keys</template>

<template data-i18n="ai-perm-title">What an assistant may do</template>
<template data-i18n="ai-perm-look"><b>Look</b><small>Read-only token, the default</small><span>Overview and alerts, jobs, backups, errors and logs, binlog / WAL archiving, restore and drill results, point-in-time recovery previews.</span></template>
<template data-i18n="ai-perm-run"><b>Start</b><small>Full-access token, operator or admin</small><span>Run a backup, verify a backup, start a restore drill. The AI client asks you before each one.</span></template>
<template data-i18n="ai-perm-set"><b>Set up</b><small>Manage token</small><span>Add servers and storages, create and change jobs and restore drills. Passwords, keys and passphrases never pass through the assistant: it gives you a link to enter them yourself.</span></template>
<template data-i18n="ai-perm-never"><b>Never over MCP</b><small>With any token</small><span>Restores, deletions and DumpCat’s settings. No option turns them on: these stay in the web UI.</span></template>
<template data-i18n="ai-perm-note">Answers never contain passwords, keys or tokens, and no tool takes one; credentials that turn up in errors and logs are masked. Every call goes through the REST API with your token, so it is checked like any other request and written to the audit log.</template>
<template data-i18n="ai-setup-title">Connect in a minute</template>
<template data-i18n="ai-steps">
  <li><div><b>Create a token</b><span>The <em>API &amp; MCP</em> page in DumpCat, <em>New token</em>: <em>Read-only</em> (the default) looks, <em>Full</em> also runs backups, <em>Manage</em> also sets them up.</span></div></li>
  <li><div><b>Copy the setup</b><span>The page fills your server’s address and the token into the Claude Code command, the Claude Desktop config and the setup for other clients.</span></div></li>
  <li><div><b>Test, then ask</b><span><em>Test MCP connection</em> shows the account, the access and the tools the assistant will get.</span></div></li>
</template>

<template data-i18n="ai-tab-agent">Other agents</template>
<template data-i18n="ai-cc-note">Put in your own address and token, or copy the filled-in command from the <em>API &amp; MCP</em> page. To share the server in a project without the token, that page also has a <code>.mcp.json</code> that reads the token from your environment.</template>
<template data-i18n="ai-cd-note">Open <em>Settings → Developer → Edit Config</em>, paste, and restart Claude Desktop. <code>dumpcat mcp</code> is a small stdio bridge that runs on the computer with Claude Desktop; on Linux, <code>command</code> is the path of the <code>dumpcat</code> binary, and on macOS you build it with Go.</template>
<template data-i18n="ai-mcp-note">The <code>/api/mcp</code> endpoint (streamable HTTP) is part of DumpCat, nothing else to install. Clients that only start a local command use <code>dumpcat mcp</code>, with <code>DUMPCAT_MCP_URL</code> and <code>DUMPCAT_MCP_TOKEN</code> in the environment.</template>
<template data-i18n="ai-md-note"><code>/api/docs.md</code> is the whole API reference in Markdown, written by the server itself so it always matches the version you run: authentication, conventions, curl examples and every route with the access it needs. Let an agent read it and call the REST API, or paste it into a chat (<em>API &amp; MCP → Copy Markdown</em>). <code>/api/mcp/tools</code> lists the MCP tools as JSON.</template>

<template data-i18n="i-linux-lead">On the Linux server, paste this command and press Enter:</template>
<template data-i18n="i-linux-note">It downloads the latest release, checks its checksum and installs it to <code>/opt/dumpcat</code> as a systemd service, with <code>rclone</code>, the MySQL/MariaDB client, the matching mariabackup or XtraBackup, and mydumper when the repositories have it; <code>--postgres 16</code> adds the PostgreSQL 16 client tools. Options go after <code>sh -s --</code>: <code>--port 9090</code>, <code>--listen 127.0.0.1</code>, <code>--tls-auto</code>.</template>

<template data-i18n="i-win-3"><b>Double-click <i>Install DumpCat</i></b> and answer <i>Yes</i>. Your browser opens DumpCat; the install window shows the setup token.</template>
